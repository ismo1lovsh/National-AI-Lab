<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030a18" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="National AI Lab — sun'iy intellekt va qo'l kuzatuvi (Widepipe) bilan interaktiv 3D ta'lim platformasi: harbiy texnika, biologiya, anatomiya va astronomiya." />
    <title>National AI Lab — Interaktiv 3D Taʼlim Tizimi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #030a18; }
      @keyframes hlab-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Manrope',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 38%, #0d2447 0%, #07152d 52%, #030a18 100%)">
        <div style="font-size:38px;animation:hlab-pulse 2s ease-in-out infinite">🖐️</div>
        <div style="font-family:'Unbounded','Manrope',sans-serif;font-size:26px;font-weight:900;letter-spacing:-.03em;color:#f0f9ff">National <span style="color:#00e5ff">AI</span> Lab</div>
        <div style="width:140px;height:2px;background:linear-gradient(90deg,#00e5ff,#00ff88,#38bdf8)"></div>
        <div style="font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#7dd3fc">Interaktiv 3D Taʼlim Tizimi</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
